<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Record ID</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --border: #334155;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --error: #f87171;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 2rem;
      min-height: 100vh;
    }
    h1 { margin: 0 0 1.5rem; font-size: 1.5rem; }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    .header h1 { margin: 0; }
    .header .actions {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .header .inception {
      color: var(--muted);
      font-size: 0.85rem;
      font-family: "SF Mono", Menlo, Consolas, monospace;
      text-align: right;
    }
    .container {
      max-width: 720px;
      margin: 0 auto;
      display: grid;
      gap: 1.5rem;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.25rem;
    }
    .panel h2 {
      margin: 0 0 1rem;
      font-size: 1rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .row {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      flex-wrap: wrap;
    }
    button {
      background: var(--accent);
      color: var(--bg);
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 4px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.9rem;
    }
    button:hover { background: var(--accent-hover); }
    button.ghost {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }
    button.ghost:hover { background: var(--border); }
    input {
      flex: 1;
      min-width: 200px;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 0.5rem 0.75rem;
      border-radius: 4px;
      font-family: "SF Mono", Menlo, Consolas, monospace;
      font-size: 0.9rem;
    }
    input:focus { outline: none; border-color: var(--accent); }
    input[type="number"] {
      flex: 0 0 5rem;
      min-width: 0;
      text-align: center;
    }
    .output {
      margin-top: 1rem;
      padding: 0.75rem;
      background: var(--bg);
      border-radius: 4px;
      font-family: "SF Mono", Menlo, Consolas, monospace;
      font-size: 0.95rem;
      min-height: 1.5rem;
      word-break: break-all;
    }
    .id-display {
      font-size: 1.1rem;
      color: var(--accent);
      letter-spacing: 0.05em;
      cursor: pointer;
      user-select: all;
      display: inline-block;
      transition: color 0.15s, transform 0.15s;
    }
    .id-display:hover { color: var(--accent-hover); }
    .id-display:active { transform: scale(0.98); }
    .id-display.copied { color: #4ade80; }
    .meta {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 0.25rem 1rem;
      font-size: 0.85rem;
      color: var(--muted);
      margin-top: 0.5rem;
    }
    .meta dt { font-weight: 600; }
    .meta dd { margin: 0; color: var(--text); }
    .meta dd div + div { margin-top: 0.15rem; }
    .muted { color: var(--muted); }
    .error { color: var(--error); }
    .history-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      margin-top: 0.75rem;
    }
    .history-header .label {
      font-size: 0.75rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .history {
      display: flex;
      flex-wrap: wrap;
      gap: 0.25rem;
      max-height: 100px;
      overflow-y: auto;
    }
    .history button {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 0.25rem 0.5rem;
      font-size: 0.75rem;
      font-weight: 400;
    }
    .history button:hover {
      color: var(--accent);
      border-color: var(--accent);
      background: transparent;
    }
    @media (max-width: 640px) {
      body { padding: 1rem; }
      .header {
        flex-direction: column;
        align-items: flex-start;
        gap: 0.75rem;
      }
      .header .actions {
        width: 100%;
        flex-wrap: wrap;
      }
      .header .inception {
        text-align: left;
        font-size: 0.75rem;
      }
      .row { flex-direction: column; align-items: stretch; }
      .row > * { width: 100%; }
      input[type="number"] { flex: 0 0 auto; }
      button { padding: 0.65rem 1rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Record ID</h1>
      <div class="actions">
        <span class="inception" title="Epoch used to compute timestamp offsets">Inception: 2026-01-01 00:00:00 UTC</span>
        <button id="reset-btn" class="ghost">Reset</button>
      </div>
    </div>

    <div class="panel">
      <h2>Generate</h2>
      <div class="row">
        <button id="gen-btn">Generate ID</button>
        <button id="gen-5-btn" class="ghost">Generate 5</button>
        <button id="gen-10-btn" class="ghost">Generate 10</button>
        <input id="gen-count" type="number" min="1" max="100" value="15" title="Count (1-100)">
        <button id="gen-n-btn" class="ghost">Generate</button>
      </div>
      <div class="output" id="gen-output">Click "Generate ID" to create one.</div>
      <div class="history-header">
        <span id="history-label" class="label" style="display: none;">Generated IDs</span>
        <button id="copy-all-btn" class="ghost" style="display: none;">Copy All</button>
      </div>
      <div class="history" id="history"></div>
    </div>

    <div class="panel">
      <h2>Inspect</h2>
      <div class="row">
        <input id="inspect-input" type="text" maxlength="20" placeholder="Paste a 20-char ID">
        <button id="inspect-btn">Inspect</button>
      </div>
      <div class="output" id="inspect-output">Enter an ID above to decode.</div>
    </div>
  </div>

  <script src="scripts/lib.js"></script>
  <script>
    const genOutput = document.getElementById('gen-output');
    const inspectInput = document.getElementById('inspect-input');
    const inspectOutput = document.getElementById('inspect-output');
    const history = document.getElementById('history');
    const genCount = document.getElementById('gen-count');

    const TIMEZONE = Intl.DateTimeFormat().resolvedOptions().timeZone;

    async function writeClipboard(text) {
      try {
        await navigator.clipboard.writeText(text);
      } catch {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
      }
    }

    async function copyId(el) {
      await writeClipboard(el.textContent);
      const original = el.textContent;
      el.textContent = 'Copied!';
      el.classList.add('copied');
      setTimeout(() => {
        el.textContent = original;
        el.classList.remove('copied');
      }, 800);
    }

    document.body.addEventListener('click', (e) => {
      const el = e.target.closest('.id-display');
      if (el) copyId(el);
    });

    function renderTimestamp(ms) {
      const d = new Date(ms);
      const utc = d.toISOString();
      const local = d.toLocaleString(undefined, { timeZoneName: 'short' });
      const delta = (ms - _INCEPTION).toFixed(0);
      return `
        <div>${local} <span class="muted">(${TIMEZONE})</span></div>
        <div class="muted">${utc} (UTC)</div>
        <div class="muted">offset +${delta}ms from inception</div>
      `;
    }

    function renderGenerated(id, ts) {
      genOutput.innerHTML = `
        <div class="id-display">${id}</div>
        <dl class="meta">
          <dt>Created</dt><dd>${renderTimestamp(ts)}</dd>
        </dl>
      `;
    }

    function addToHistory(id) {
      const btn = document.createElement('button');
      btn.textContent = id;
      btn.addEventListener('click', () => {
        inspectInput.value = id;
        runInspect();
      });
      history.prepend(btn);
      while (history.children.length > 20) history.removeChild(history.lastChild);
      document.getElementById('copy-all-btn').style.display = '';
      document.getElementById('history-label').style.display = '';
    }

    document.getElementById('gen-btn').addEventListener('click', () => {
      const { id, ts } = genIdWithTime();
      renderGenerated(id, ts);
      addToHistory(id);
    });

    function generateBatch(n) {
      const ids = [];
      for (let i = 0; i < n; i++) {
        const { id, ts } = genIdWithTime();
        ids.push({ id, ts });
        addToHistory(id);
      }
      const last = ids[ids.length - 1];
      renderGenerated(last.id, last.ts);
    }

    document.getElementById('gen-5-btn').addEventListener('click', () => generateBatch(5));
    document.getElementById('gen-10-btn').addEventListener('click', () => generateBatch(10));
    document.getElementById('gen-n-btn').addEventListener('click', () => {
      let n = parseInt(genCount.value, 10);
      if (!Number.isFinite(n)) n = 1;
      n = Math.max(1, Math.min(100, n));
      genCount.value = n;
      generateBatch(n);
    });

    function runInspect() {
      const id = inspectInput.value.trim();
      if (id.length !== 20) {
        inspectOutput.innerHTML = '<span class="error">ID must be exactly 20 characters.</span>';
        return;
      }
      try {
        const { ts, mid, cnt } = inspect(id);
        inspectOutput.innerHTML = `
          <div class="id-display">${id}</div>
          <dl class="meta">
            <dt>Timestamp</dt><dd>${renderTimestamp(ts)}</dd>
            <dt>Machine ID</dt><dd>${mid}</dd>
            <dt>Counter</dt><dd>${cnt}</dd>
          </dl>
        `;
      } catch (e) {
        inspectOutput.innerHTML = `<span class="error">Invalid ID: ${e.message}</span>`;
      }
    }

    document.getElementById('inspect-btn').addEventListener('click', runInspect);
    inspectInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') runInspect();
    });

    const initialId = new URLSearchParams(location.search).get('id');
    if (initialId) {
      inspectInput.value = initialId;
      runInspect();
      document.getElementById('reset-btn').scrollIntoView({ block: 'start' });
      inspectInput.focus();
    }

    document.getElementById('reset-btn').addEventListener('click', () => {
      genOutput.innerHTML = 'Click "Generate ID" to create one.';
      inspectInput.value = '';
      inspectOutput.innerHTML = 'Enter an ID above to decode.';
      history.innerHTML = '';
      document.getElementById('copy-all-btn').style.display = 'none';
      document.getElementById('history-label').style.display = 'none';
      inspectInput.focus();
    });

    document.getElementById('copy-all-btn').addEventListener('click', async () => {
      const ids = Array.from(history.children).map(btn => btn.textContent);
      const btn = document.getElementById('copy-all-btn');
      await writeClipboard(ids.join('\n'));
      const original = btn.textContent;
      btn.textContent = `Copied ${ids.length}!`;
      setTimeout(() => { btn.textContent = original; }, 800);
    });
  </script>
</body>
</html>
